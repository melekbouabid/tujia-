# Production web server of the frontend image: serves the built React app and forwards the
# API, the Swagger UI and its schema to the backend container, so the browser talks to one
# origin (same as the Vite dev proxy in vite.config.ts).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Pill photos are uploaded to /api/scan; the API refuses anything above its own limit.
    client_max_body_size 12m;

    # The agent's answer is streamed (Server-Sent Events): no buffering, and a long timeout
    # because the first question also loads the models into the GPU.
    location = /api/chat {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Built assets have a hash in their name and never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other address is a page of the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
