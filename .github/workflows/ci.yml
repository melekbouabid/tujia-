# Continuous integration: lint and unit tests of every Python package, frontend build.
# No job touches the network beyond installing dependencies: all HTTP in the tests is mocked
# (live tests are marked `live` and excluded), and no data is downloaded.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: data pipeline (src/, tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy
      - run: python -m pytest tests/unit

  backend:
    name: backend (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  vision:
    name: vision (data preparation, no training)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Only what the unit tests import: training (ultralytics, mlflow) is not run in CI.
      - run: pip install pytest ruff numpy opencv-python-headless
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  frontend:
    name: frontend (type check and build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
