# Continuous delivery without publishing: after the `ci` workflow succeeds on a push to main,
# build the backend and frontend Docker images of that exact commit and smoke-test them.
# Nothing is pushed: the app runs only on the owner's PC (CLAUDE.md, D69, D70).
#
# Publishing to GitHub Container Registry stays possible only by hand, as an explicit opt-in:
#   gh workflow run cd -f push_images=true     (off by default; see docs/CD.md)
# The images contain code only (no data, no model, no secret).
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      push_images:
        description: "Also push the images to ghcr.io (off by default: the app runs only locally)"
        type: boolean
        default: false

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.image }} image (build + smoke test)
    # Only after a green CI run of a push (not of a pull request), or when started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No build record artifact attached to the run either: nothing leaves the runner.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build (local image only, never pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          load: true
          push: false
          tags: tujya-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke test of the backend image
        if: matrix.image == 'backend'
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e SYNERGYRX_DATABASE_URL=sqlite:////tmp/accounts.db tujya-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8000/docs
          curl -fsS http://127.0.0.1:8000/openapi.json | grep -q '"/api/scan"'
          curl -fsS http://127.0.0.1:8000/openapi.json | grep -q '"/api/chat"'
          docker logs api

      - name: Smoke test of the frontend image
        if: matrix.image == 'frontend'
        run: |
          docker run -d --name web --add-host backend:127.0.0.1 -p 127.0.0.1:8080:80 tujya-frontend:ci
          sleep 3
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://127.0.0.1:8080/scan

      - name: Summary
        run: |
          {
            echo "### tujya-${{ matrix.image }}"
            echo "Built and smoke-tested at $(git rev-parse --short HEAD). **Not pushed** (strictly local app, docs/CD.md)."
            docker image ls tujya-${{ matrix.image }}:ci --format 'Size: {{.Size}}'
          } >> "$GITHUB_STEP_SUMMARY"

  # Manual opt-in only (workflow_dispatch with push_images=true). Never runs on a push.
  publish:
    name: push ${{ matrix.image }} to ghcr.io (manual opt-in)
    needs: images
    if: github.event_name == 'workflow_dispatch' && inputs.push_images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tags
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/tujya-${{ matrix.image }}"
          echo "tags=${image}:latest,${image}:sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.names.outputs.revision }}
            org.opencontainers.image.title=tujya-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Summary
        run: echo "Pushed ${{ steps.names.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
