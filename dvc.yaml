# DVC pipeline. The raw C3PI images and metadata are tracked with `dvc add`
# (data/vision/c3pi/*.dvc); the datasets built from them are a pipeline stage, so
# `dvc repro` rebuilds them when the images, the split list or the labelling code change.
# `prepare`: run from the repository root with the vision venv active (vision/.venv).
# `rag_corpus`: with the pipeline venv active (.venv-dev); its inputs, the openFDA labels and
# PubMed abstracts under data/rag/raw and data/rag/interim, are fetched by
# `python -m synergyrx_data.tujya labels` / `pubmed` and tracked with `dvc add` (docs/RAG.md).
stages:
  prepare:
    wdir: vision
    cmd: python -m tujya_vision.prepare
    deps:
      - ../data/vision/c3pi/images
      - ../config/splits/selected_images.csv
      - tujya_vision/autolabel.py
      - tujya_vision/prepare.py
    outs:
      - ../data/vision/c3pi/labels
      - ../data/vision/datasets
  rag_corpus:
    cmd: python -m synergyrx_data.tujya corpus
    deps:
      - data/rag/interim
      - data/rag/raw/pubmed
      - data/tujya/interactions_between_classes.csv
      - data/tujya/pill_ingredients.csv
      - src/synergyrx_data/tujya/corpus.py
    outs:
      - data/rag/corpus
